<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mwaũra Wakati — systems engineer</title>
  <desc id="desc">Terminal-style banner highlighting Rust, Solana, low-latency systems, coherent state, bounded work, safe execution, and forensics.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100f" />
      <stop offset="0.55" stop-color="#0b1715" />
      <stop offset="1" stop-color="#07100f" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2dd4bf" stroke-opacity="0.055" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#background)" />
  <rect width="1200" height="320" rx="18" fill="url(#grid)" />
  <rect x="1.5" y="1.5" width="1197" height="317" rx="16.5" fill="none" stroke="#2dd4bf" stroke-opacity="0.36" stroke-width="3" />

  <rect x="28" y="24" width="1144" height="272" rx="12" fill="#07100f" fill-opacity="0.68" stroke="#334b47" stroke-width="1" />
  <circle cx="54" cy="48" r="6" fill="#fb7185" />
  <circle cx="76" cy="48" r="6" fill="#facc15" />
  <circle cx="98" cy="48" r="6" fill="#34d399" />
  <text x="600" y="53" text-anchor="middle" fill="#718a85" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">mwaura@systems — ~/hot-path</text>

  <text x="54" y="91" fill="#2dd4bf" font-family="Menlo, Monaco, Consolas, monospace" font-size="17">mwaura@systems:~$ whoami</text>
  <text x="54" y="145" fill="#f8fafc" font-family="Menlo, Monaco, Consolas, monospace" font-size="42" font-weight="700" letter-spacing="1">MWAŨRA WAKATI</text>
  <text x="56" y="179" fill="#a8c3bd" font-family="Menlo, Monaco, Consolas, monospace" font-size="19">Rust · Solana · low-latency systems · DeFi infrastructure</text>
  <text x="56" y="214" fill="#2dd4bf" font-family="Menlo, Monaco, Consolas, monospace" font-size="16" filter="url(#glow)">coherent state → bounded work → safe execution → causal forensics</text>

  <g transform="translate(54 244)" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">
    <rect width="116" height="28" rx="5" fill="#10231f" stroke="#245148" />
    <text x="58" y="19" text-anchor="middle" fill="#d9f5ef">ingest</text>
    <text x="132" y="19" fill="#486d65">→</text>
    <rect x="152" width="116" height="28" rx="5" fill="#10231f" stroke="#245148" />
    <text x="210" y="19" text-anchor="middle" fill="#d9f5ef">cohere</text>
    <text x="284" y="19" fill="#486d65">→</text>
    <rect x="304" width="116" height="28" rx="5" fill="#10231f" stroke="#245148" />
    <text x="362" y="19" text-anchor="middle" fill="#d9f5ef">schedule</text>
    <text x="436" y="19" fill="#486d65">→</text>
    <rect x="456" width="116" height="28" rx="5" fill="#10231f" stroke="#245148" />
    <text x="514" y="19" text-anchor="middle" fill="#d9f5ef">execute</text>
    <text x="588" y="19" fill="#486d65">→</text>
    <rect x="608" width="116" height="28" rx="5" fill="#10231f" stroke="#245148" />
    <text x="666" y="19" text-anchor="middle" fill="#d9f5ef">verify</text>
  </g>

  <text x="1148" y="263" text-anchor="end" fill="#718a85" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">Nairobi · UTC+3</text>
</svg>
